name: assignment3-webhook

on:
  push:
    paths:
      - "assignment3/**"
      - ".github/workflows/assignment3.yml"
  pull_request:
    paths:
      - "assignment3/**"
  workflow_dispatch:
    inputs:
      deploy:
        description: "Also terraform apply (billable). Default is false."
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: predixion-call-webhook

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignment3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  build-and-push:
    needs: test
    # Job-level `if` cannot read `secrets`. Push/PR only runs tests.
    # ECR push is manual until AWS_OIDC_ROLE_ARN is configured.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require OIDC role
        env:
          ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "Set repo secret AWS_OIDC_ROLE_ARN before dispatching this job."
            exit 1
          fi
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        working-directory: assignment3
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

  deploy:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' && inputs.deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Terraform apply
        working-directory: assignment3/terraform
        run: |
          terraform init
          terraform apply -auto-approve -var="image_tag=${GITHUB_SHA}"
        env:
          TF_IN_AUTOMATION: "true"
