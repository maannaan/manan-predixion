name: assignment3-webhook

on:
  push:
    paths:
      - "assignment3/**"
      - ".github/workflows/assignment3.yml"
  pull_request:
    paths:
      - "assignment3/**"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: predixion-call-webhook
  ECS_CLUSTER: predixion-call-webhook
  ECS_SERVICE: predixion-call-webhook

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: assignment3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest

  build-and-push:
    needs: test
    # Job-level `if` cannot read `secrets`. Push/PR only runs tests.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.push.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - name: Require OIDC role
        env:
          ROLE: ${{ secrets.AWS_OIDC_ROLE_ARN }}
        run: |
          if [ -z "$ROLE" ]; then
            echo "Set repo secret AWS_OIDC_ROLE_ARN before dispatching this job."
            exit 1
          fi
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        id: push
        working-directory: assignment3
        run: |
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          IMAGE="${REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          LATEST="${REGISTRY}/${ECR_REPOSITORY}:latest"
          docker build -t "$IMAGE" -t "$LATEST" .
          docker push "$IMAGE"
          docker push "$LATEST"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  deploy:
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Roll ECS service
        run: |
          aws ecs update-service \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_SERVICE" \
            --force-new-deployment \
            --query 'service.{status:status,taskDefinition:taskDefinition,desiredCount:desiredCount}' \
            --output table
          aws ecs wait services-stable --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE"
